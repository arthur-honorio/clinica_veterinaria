<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Amor de Bicho| Clínica Veterinária</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Amor de Bicho</h1>
            <p>Clínica Veterinária</p>

        </header>
        <main>
            <section class="boas-vindas">
                <h2>Bem-vindo á Amor de Bicho!</h2>
                <p>
                
                    Cuidando de quem faz parte da sua família.
                </p>

            </section>
            <section class="menu">
                <div class="card">
                    <h3>Tutores</h3>
                    <p>Gerencie os responsáveis pelos animais.</p>
                    <button>Cadastrar Tutor</button>
                </div>
                <div class="card">
                    <h3>Animais</h3>
                    <p>Gerencie os animais cadastradis na clínica.</p>
                    <button type="button" onclick="mostrarFormularioTutor()">
                         Cadastrar animal
                    </button>
                </div>
            </section>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" required>

            <label for="telefone">Telefone:  </label>
            <input type="tel" id="telefone" required>

            <label for="endereço">Endereço</label>
            <input type="text" id="endereço" required>

            <button type="submit">Salvar Tutor</button>

            <button type="button"onclick="fecharFormularioTutor()">
                Cancelar
            </button>
            </from>
        </main>
        <footer>
            <p> Amor de Bicho 2026- Clínica Veterinária</p>
        </footer>
        <script src="script.js"></script>

    </body>
</html>
