<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor | Amor de Bicho</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a href="index.html" class="marca">
            <h1>Amor de Bicho</h1>
            <p>Clínica Veterinária</p>
        </a>
        <nav>
            <a href="index.html">Início</a>
            <a href="tutores.html" aria-current="page">Tutores</a>
            <a href="animais.html">Animais</a>
        </nav>
    </header>

    <main>
        <section class="painel formulario">
            <h2 id="tituloFormulario">Cadastro de Tutor</h2>

            <div id="mensagem" class="mensagem" role="alert" hidden></div>

            <form id="formTutor" novalidate>
                <label for="nome">Nome completo *</label>
                <input type="text" id="nome" name="nome" maxlength="100" autocomplete="name">

                <label for="telefone">Telefone (com DDD) *</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(85) 99999-1111"
                    inputmode="numeric" autocomplete="tel-national">

                <label for="endereco">Endereço *</label>
                <input type="text" id="endereco" name="endereco" maxlength="200"
                    autocomplete="street-address">

                <div class="botoes-formulario">
                    <a class="botao botao-secundario" href="tutores.html">Cancelar</a>
                    <button type="submit">Salvar tutor</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Amor de Bicho 2026 - Clínica Veterinária</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tutorForm.js"></script>
</body>

</html>
