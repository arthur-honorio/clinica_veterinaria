<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amor de Bicho | Clínica Veterinária</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Amor de Bicho</h1>
        <p>Clínica Veterinária</p>
    </header>
    <main>
        <!-- FORMULÁRIO DE TUTOR -->

        <section class="formulario">

            <h2>Cadastro de Tutor</h2>

            <form>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" required>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" required>

                <div class="botoes-formulario">
                    <button type="submit">Salvar Tutor</button>

                    <button type="button" onclick="fecharFormulario()">
                        Cancelar
                    </button>
                </div>

            </form>

        </section>
    </main>
    <footer>
        <p>Amor de Bicho 2026 - Clínica Veterinária</p>
    </footer>
    <script src="js/script.js"></script>

</body>

</html>
