<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal | Patas &amp; Cia</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a href="index.html" class="marca">
            <h1>Patas &amp; Cia</h1>
            <p>Clínica Veterinária</p>
        </a>
        <nav>
            <a href="index.html">Início</a>
            <a href="tutores.html">Tutores</a>
            <a href="animais.html" aria-current="page">Animais</a>
        </nav>
    </header>

    <main>
        <section class="painel formulario">
            <h2 id="tituloFormulario">Cadastro de Animal</h2>

            <div id="mensagem" class="mensagem" role="alert" hidden></div>

            <form id="formAnimal" novalidate>
                <label for="nome">Nome do animal *</label>
                <input type="text" id="nome" name="nome" maxlength="100">

                <label for="especie">Espécie *</label>
                <input type="text" id="especie" name="especie" maxlength="50" placeholder="Ex.: Cão, Gato"
                    list="sugestoesEspecie">
                <datalist id="sugestoesEspecie">
                    <option value="Cão"></option>
                    <option value="Gato"></option>
                    <option value="Ave"></option>
                    <option value="Roedor"></option>
                    <option value="Réptil"></option>
                </datalist>

                <label for="raca">Raça *</label>
                <input type="text" id="raca" name="raca" maxlength="50" placeholder="Ex.: SRD, Poodle">

                <label for="tutor_id">Tutor responsável *</label>
                <select id="tutor_id" name="tutor_id">
                    <option value="">Selecione um tutor</option>
                </select>

                <label for="nascimento">Data de nascimento *</label>
                <input type="date" id="nascimento" name="nascimento">

                <div class="botoes-formulario">
                    <a class="botao botao-secundario" id="linkCancelar" href="animais.html">Cancelar</a>
                    <button type="submit">Salvar animal</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Patas &amp; Cia 2026 - Clínica Veterinária</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/animalForm.js"></script>
</body>

</html>
